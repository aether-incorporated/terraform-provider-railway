name: Tests
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
concurrency:
  group: test-${{ github.ref }}
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install deps
        run: go mod download
      - name: Build
        run: go build -v .
  generate:
    name: Generated code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Check generated code
        run: |
          go generate ./...
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)
  test:
    name: Terraform Provider Acceptance Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.*
          terraform_wrapper: false
      - name: Install deps
        run: go mod download
      - name: Note skipped acceptance tests
        if: env.HAS_RAILWAY_TOKEN != 'true'
        run: echo "::warning::RAILWAY_TOKEN is not set, so acceptance tests are skipped and only unit tests run."
      - name: Test
        env:
          # Without a token, TF_ACC stays empty and the acceptance tests skip themselves.
          TF_ACC: ${{ env.HAS_RAILWAY_TOKEN == 'true' && '1' || '' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TEST_WORKSPACE_ID: ${{ vars.RAILWAY_TEST_WORKSPACE_ID }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
